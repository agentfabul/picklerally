name: Android APK

# Builds the Pickle Rally Android app and publishes the APK as a GitHub Release
# so it can be downloaded and installed on any Android phone.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # The app signs with ${rootDir}/debug.keystore (see app/build.gradle.kts).
      # Use the same keystore as AI Studio (secret DEBUG_KEYSTORE_BASE64) so the SHA-1
      # matches Firebase and Google sign-in works. Without the secret, a new keystore
      # is generated: the APK still installs, but Google sign-in needs its SHA-1 added
      # in Firebase (printed below).
      - name: Prepare signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Using keystore from DEBUG_KEYSTORE_BASE64 secret"
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Using keystore from debug.keystore.base64 in the repo"
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::No DEBUG_KEYSTORE_BASE64 secret - generated a new keystore. Add its SHA-1 to Firebase for Google sign-in."
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256"

      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Using app/google-services.json from the repo"
          elif [ -f .github/google-services.json ]; then
            cp .github/google-services.json app/google-services.json
            echo "Using .github/google-services.json from the repo"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Wrote app/google-services.json from the GOOGLE_SERVICES_JSON secret"
          else
            echo "::error::Missing GOOGLE_SERVICES_JSON secret. Add it in Settings > Secrets and variables > Actions (paste the contents of google-services.json from Firebase)."
            exit 1
          fi

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Name the APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0.0")
          cp "$APK" PickleRally.apk
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PickleRally-apk
          path: PickleRally.apk

      - name: Publish release to public download repo
        if: env.HAS_RELEASES_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: agentfabul/pickle-rally
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Pickle Rally ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          make_latest: true
          files: PickleRally.apk
          body: |
            ## Install on Android
            1. Download **PickleRally.apk** below on your Android phone.
            2. Open it. If asked, allow your browser to **install unknown apps**.
            3. Tap **Install**, then open Pickle Rally.

            Updating: install the new APK over the old one; your local progress stays.

            Prefer the browser? Play at https://picklerally-two.vercel.app

      # Fallback until the RELEASES_TOKEN secret exists: publish in this private repo.
      - name: Publish release to this repo (no RELEASES_TOKEN yet)
        if: env.HAS_RELEASES_TOKEN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Pickle Rally ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          make_latest: true
          files: PickleRally.apk
          body: |
            ## Install on Android
            1. Download **PickleRally.apk** below on your Android phone.
            2. Open it. If asked, allow your browser to **install unknown apps**.
            3. Tap **Install**, then open Pickle Rally.

            Built from commit ${{ github.sha }}.
